image: node:18.12.1

pipelines:
  branches: # Pipelines that run automatically on a push to a master
    master:
      - step:
          deployment: dev
          size: 2x
          caches:
            - node
          name: Automatacilly Deploy to Infinite Dev https://pwa-infinite-dev.hudini.app/
          script:
            - rm -rf package-lock.json
            - rm -rf yarn.lock
            - rm -rf node_modules
            - yarn
            - CI='' yarn build:production
            - CI='' yarn export
            - cd out
            - pipe: atlassian/aws-s3-deploy:0.4.1
              variables:
                AWS_ACCESS_KEY_ID: $AWS_ACCESS_KEY_UAT # Optional if already defined in the context.
                AWS_SECRET_ACCESS_KEY: $AWS_SECRET_ACCESS_KEY_UAT # Optional if already defined in the context.
                AWS_DEFAULT_REGION: $AWS_DEFAULT_REGION_UAT # Optional if already defined in the context.
                #ACL: 'public-read'
                S3_BUCKET: $S3_BUCKET_PWA_INFINITE_DEV
                LOCAL_PATH: $(pwd)
            - pipe: atlassian/aws-cloudfront-invalidate:0.4.1
              variables:
                AWS_ACCESS_KEY_ID: $AWS_ACCESS_KEY_UAT
                AWS_SECRET_ACCESS_KEY: $AWS_SECRET_ACCESS_KEY_UAT
                AWS_DEFAULT_REGION: $AWS_DEFAULT_REGION_UAT
                DISTRIBUTION_ID: 'E9PVO4YEDANZA'
  custom:
    deployToDevelopment:
      - step:
          caches:
            - node
          name: Deploy Manually to Development https://pwa-infinite.hudinielevate-dev.io/
          deployment: dev
          size: 2x # Double resources available for this step.
          script:
            - rm -rf package-lock.json
            - rm -rf yarn.lock
            - rm -rf node_modules
            - yarn
            - CI='' yarn build:dev
            - CI='' yarn export
            - cd out
            - pipe: atlassian/aws-s3-deploy:0.4.1
              variables:
                AWS_ACCESS_KEY_ID: $AWS_ACCESS_KEY_DEV # Optional if already defined in the context.
                AWS_SECRET_ACCESS_KEY: $AWS_SECRET_ACCESS_KEY_DEV # Optional if already defined in the context.
                AWS_DEFAULT_REGION: $AWS_DEFAULT_REGION_DEV # Optional if already defined in the context.
                #ACL: 'public-read'
                S3_BUCKET: $S3_BUCKET_INFINITE_DEV
                LOCAL_PATH: $(pwd)
            - pipe: atlassian/aws-cloudfront-invalidate:0.4.1
              variables:
                AWS_ACCESS_KEY_ID: $AWS_ACCESS_KEY_DEV
                AWS_SECRET_ACCESS_KEY: $AWS_SECRET_ACCESS_KEY_DEV
                AWS_DEFAULT_REGION: $AWS_DEFAULT_REGION_DEV
